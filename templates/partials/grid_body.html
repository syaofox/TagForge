{% if not current %}
  <div class="tf-empty"><svg class="tf-empty-icon" aria-hidden="true"><use href="/static/icons.svg#icon-inbox"/></svg><span>请先在左侧选择或新建一个项目</span></div>
{% elif not entries %}
  <div class="tf-empty"><svg class="tf-empty-icon" aria-hidden="true"><use href="/static/icons.svg#icon-image"/></svg><span>该项目还没有图片，点击顶栏「上传图片」开始</span></div>
{% elif items | length == 0 %}
  <div class="tf-empty"><svg class="tf-empty-icon" aria-hidden="true"><use href="/static/icons.svg#icon-search-x"/></svg><span>没有匹配的图片（试试清空筛选或搜索）</span></div>
{% else %}
  {% for entry in shown %}{% include "partials/card.html" %}{% endfor %}
{% endif %}
