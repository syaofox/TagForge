<dialog id="dlg-new-project" class="tf-dialog">
  <div class="tf-dialog-card">
    <h3 class="tf-dialog-title">新建项目</h3>
    <input id="new-project-name" class="tf-input" type="text" placeholder="项目名称">
    <div class="tf-dialog-actions">
      <button class="btn btn-ghost" data-close>取消</button>
      <button class="btn btn-primary" id="btn-confirm-new-project">创建</button>
    </div>
  </div>
</dialog>

<dialog id="dlg-confirm" class="tf-dialog">
  <div class="tf-dialog-card">
    <p id="confirm-text" style="margin:0">确定执行该操作吗？</p>
    <div class="tf-dialog-actions">
      <button class="btn btn-ghost" data-close>取消</button>
      <button class="btn btn-danger" id="btn-confirm-ok">确定</button>
    </div>
  </div>
</dialog>

<dialog id="dlg-preset" class="tf-dialog">
  <div class="tf-dialog-card">
    <h3 class="tf-dialog-title" id="dlg-preset-title">新增模型预设</h3>
    <label class="tf-label">预设名</label>
    <input id="preset-name" class="tf-input" type="text" placeholder="如 我的中转站">
    <label class="tf-label">Base URL</label>
    <input id="preset-base-url" class="tf-input" type="text" placeholder="https://…/v1">
    <label class="tf-label">模型名</label>
    <input id="preset-model" class="tf-input" type="text" placeholder="模型名（可稍后填写或从提供商拉取）">
    <div class="tf-dialog-actions">
      <button class="btn btn-ghost" data-close>取消</button>
      <button class="btn btn-primary" id="btn-save-preset">保存</button>
    </div>
  </div>
</dialog>

<dialog id="dlg-help" class="tf-dialog">
  <div class="tf-dialog-card">
    <h3 class="tf-dialog-title" style="display:flex;align-items:center;gap:8px"><svg class="tf-icon" width="18" height="18" aria-hidden="true"><use href="/static/icons.svg#icon-logo"/></svg> TagForge — LoRA 数据集图片打标工具</h3>
    <p class="tf-muted" style="margin:0;font-size:12.5px;line-height:1.6">左侧配置模型并新建/选择项目；上传图片后点击卡片进行标注；「开始批量标注」会并发调用大模型为待标注/失败图片生成标签。</p>
    <div class="tf-dialog-actions"><button class="btn btn-ghost" data-close>知道了</button></div>
  </div>
</dialog>
