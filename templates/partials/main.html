<div class="tf-main-wrap">
  <div class="tf-toolbar tf-wide">
    <div class="tf-toolbar-row">
      <span id="toolbar-title" class="tf-toolbar-title">{{ current or '（未选择项目）' }}</span>
      <div class="tf-toolbar-actions">
        <input type="file" id="upload-input" multiple hidden>
        <button class="btn btn-indigo" id="btn-upload"><svg class="tf-icon tf-icon--sm" aria-hidden="true"><use href="/static/icons.svg#icon-upload"/></svg> 上传图片</button>
        <span id="upload-status" class="tf-muted tf-hint" hidden></span>
        <button class="btn btn-primary" id="btn-batch"><svg class="tf-icon tf-icon--sm" aria-hidden="true"><use href="/static/icons.svg#icon-play"/></svg> 开始批量标注</button>
        <button class="btn btn-ghost" id="btn-trial" style="border:1px solid var(--tf-border);"><svg class="tf-icon tf-icon--sm" aria-hidden="true"><use href="/static/icons.svg#icon-beaker"/></svg> 试生成 1 张</button>
        <progress id="main-progress" class="tf-progress" max="1" value="0" hidden style="width:160px"></progress>
      </div>
    </div>
    <div id="api-banner" class="tf-banner" hidden>
      <svg class="tf-icon tf-icon--md" aria-hidden="true"><use href="/static/icons.svg#icon-alert"/></svg> 尚未配置可用的 API（需 Base URL / 模型名；Ollama 之外还需 API Key）。配置后点「测试连接」验证可用后再批量标注。
    </div>
  </div>

  <div id="meta-bar" class="tf-meta-bar tf-wide"></div>
  {% include "partials/batch_card.html" %}
  <div id="grid" class="tf-grid tf-wide"
    {% if current %} hx-get="/partials/grid_cards" hx-trigger="load" hx-swap="innerHTML" {% endif %}></div>
  <div id="grid-footer" class="tf-wide"></div>
</div>
